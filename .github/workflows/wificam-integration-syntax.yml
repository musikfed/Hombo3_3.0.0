name: T23N integration syntax
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile camera integration Python files
        run: |
          python -m py_compile backend/app/config.py
          python -m py_compile backend/app/camera.py
          python -m py_compile backend/app/camera_speaker.py
          python -m py_compile backend/app/camera_speech.py
          python -m py_compile backend/app/main.py
          python -m py_compile scripts/probe_wificam.py
      - name: Linux project lifecycle syntax and robot safety contract
        run: |
          bash -n start.sh stop.sh
          python -m unittest discover -s tests -p 'test_project_lifecycle.py' -v
      - name: Mock ONVIF motor and zoom tests
        run: python -m unittest discover -s tests -p 'test_camera_ptz.py'
      - name: Mock STT WAV and operator authentication tests
        run: python -m unittest discover -s tests -p 'test_camera_speech.py'
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and compile dashboard
        run: |
          cd frontend
          npm ci
          npm run build
